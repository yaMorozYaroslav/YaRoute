name: CI

on:
  push:
    branches: [master, tester]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject Heroku deployment credentials in GitHub Actions
        run: node scripts/guard-no-heroku-actions.mjs
      - name: Install dependencies
        env:
          NYX_SKIP_RCLONE_INSTALL: '1'
        run: npm ci
      - name: Security check
        run: npm run security:check
      - name: Build NestJS
        run: npm run build
      - name: Install Rclone for integration tests
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rclone
          fi
          rclone version
          echo "RCLONE_BINARY=$(command -v rclone)" >> "$GITHUB_ENV"
      - name: Run tests
        run: npm test

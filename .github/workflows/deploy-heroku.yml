name: Deploy to Heroku

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy YaRoute master to dev-nest-nyx
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          test -n "$HEROKU_API_KEY"
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/dev-nest-nyx.git"
          git push heroku HEAD:main --force

      - name: Smoke test deployed app
        run: |
          set -euo pipefail
          BASE="https://dev-nest-nyx-0df80c227630.herokuapp.com"

          for i in 1 2 3 4 5 6; do
            if curl -fsS "${BASE}/health" >/tmp/health.json; then
              break
            fi
            sleep 5
          done

          cat /tmp/health.json

          curl -fsS "${BASE}/.well-known/oauth-protected-resource" >/tmp/oauth-metadata.json
          cat /tmp/oauth-metadata.json

          status="$(curl -sS -o /tmp/mcp-unauth.txt -w '%{http_code}' "${BASE}/mcp")"
          test "$status" = "401"
